<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Конструктор страниц</title>
    <link rel="stylesheet" href="style.css">
    <style>
        .builder-wrapper {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 30px;
            max-width: 1200px;
            margin: 0 auto;
        }

        @media (max-width: 900px) {
            .builder-wrapper { grid-template-columns: 1fr; }
        }

        .form-card {
            background-color: #1f1f1f;
            padding: 24px;
            border-radius: 12px;
            border: 1px solid #2d2d2d;
        }

        .form-group {
            margin-bottom: 18px;
        }

        .form-group label {
            display: block;
            font-size: 0.9rem;
            margin-bottom: 6px;
            color: #b0b0b0;
        }

        .form-group input, .form-group textarea {
            width: 100%;
            padding: 10px 12px;
            background-color: #121212;
            border: 1px solid #333;
            border-radius: 6px;
            color: #fff;
            font-size: 0.95rem;
            outline: none;
        }

        .form-group input:focus, .form-group textarea:focus {
            border-color: #555;
        }

        .btn-download {
            width: 100%;
            padding: 12px;
            background-color: #2e7d32;
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s;
            margin-top: 10px;
        }

        .btn-download:hover {
            background-color: #388e3c;
        }

        .preview-title {
            font-size: 0.85rem;
            color: #888;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 12px;
        }

        .preview-box {
            background-color: #121212;
            padding: 20px;
            border: 1px dashed #444;
            border-radius: 12px;
        }
    </style>
</head>
<body>

    <div class="builder-wrapper">
        <!-- Левая колонка: Форма ввода -->
        <div class="form-card">
            <h2 style="margin-bottom: 20px;">🛠 Создать новую страницу</h2>

            <div class="form-group">
                <label>Имя файла (без .html)</label>
                <input type="text" id="fileName" value="page-3" placeholder="например: page-3">
            </div>

            <div class="form-group">
                <label>Заголовок (текст сверху)</label>
                <input type="text" id="pageHeading" value="Тема с фото и видео" oninput="updatePreview()">
            </div>

            <div class="form-group">
                <label>Основной текст</label>
                <textarea id="pageText" rows="4" oninput="updatePreview()">Первый абзац.

Ниже расположены фото с прокруткой и видеофайл.</textarea>
            </div>

            <div class="form-group">
                <label>Пути к картинкам (каждый путь с новой строки)</label>
                <textarea id="imageUrls" rows="3" oninput="updatePreview()">images/photo1.jpg
images/photo2.jpg</textarea>
            </div>

            <div class="form-group">
                <label>Пути к видео (каждый путь с новой строки, опционально)</label>
                <textarea id="videoUrls" rows="2" placeholder="videos/video1.mp4" oninput="updatePreview()"></textarea>
            </div>

            <button class="btn-download" onclick="downloadHTML()">📥 Скачать HTML-файл</button>
            <button class="btn-download" onclick="copyHTML()" style="background-color: #444; margin-top: 8px;">📋 Скопировать код</button>
        </div>

        <!-- Правая колонка: Предпросмотр -->
        <div>
            <div class="preview-title">Предпросмотр результата:</div>
            <div class="preview-box">
                <main class="container" style="padding: 0;">
                    <header class="site-header">
                        <img src="images/logo.png" alt="Логотип" class="header-logo">
                        <span class="header-title">Музей СВО</span>
                    </header>

                    <h1 id="prevHeading">Тема с фото и видео</h1>
                    
                    <div id="prevTextContainer"></div>
                    <div id="prevGalleryContainer"></div>
                    <div id="prevVideoContainer"></div>
                </main>
            </div>
        </div>
    </div>

    <script>
        // Форматирование текста на абзацы
        function formatTextToHTML(text) {
            if (!text) return '';
            return text
                .split('\n')
                .filter(line => line.trim() !== '')
                .map(line => `<p>${line.trim()}</p>`)
                .join('\n        ');
        }

        // Форматирование списка картинок в скроллируемую галерею
        function formatImagesToHTML(text) {
            if (!text) return '';
            const lines = text.split('\n').map(l => l.trim()).filter(l => l !== '');
            if (lines.length === 0) return '';

            const isSingle = lines.length === 1 ? ' single-image' : '';
            const items = lines.map(src => `
            <div class="gallery-item">
                <img src="${src}" alt="Фото">
            </div>`).join('');

            return `<div class="gallery-container${isSingle}">${items}\n        </div>`;
        }

        // Форматирование списка видеофайлов в плееры
        function formatVideosToHTML(text) {
            if (!text) return '';
            const lines = text.split('\n').map(l => l.trim()).filter(l => l !== '');
            if (lines.length === 0) return '';

            return lines.map(src => `
        <div class="video-wrapper">
            <video controls preload="metadata">
                <source src="${src}" type="video/mp4">
                Ваш браузер не поддерживает видео.
            </video>
        </div>`).join('\n');
        }

        // Обновление предпросмотра
        function updatePreview() {
            document.getElementById('prevHeading').innerText = document.getElementById('pageHeading').value;
            
            document.getElementById('prevTextContainer').innerHTML = formatTextToHTML(document.getElementById('pageText').value);
            document.getElementById('prevGalleryContainer').innerHTML = formatImagesToHTML(document.getElementById('imageUrls').value);
            document.getElementById('prevVideoContainer').innerHTML = formatVideosToHTML(document.getElementById('videoUrls').value);
        }

        // Генерация итогового HTML
        function generateHTML() {
            const pageHeading = document.getElementById('pageHeading').value;
            const formattedText = formatTextToHTML(document.getElementById('pageText').value);
            const formattedGallery = formatImagesToHTML(document.getElementById('imageUrls').value);
            const formattedVideos = formatVideosToHTML(document.getElementById('videoUrls').value);

            return `<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>${pageHeading}</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <main class="container">
        <header class="site-header">
            <img src="images/logo.png" alt="Логотип" class="header-logo">
            <span class="header-title">Музей СВО</span>
        </header>

        <h1>${pageHeading}</h1>
        ${formattedText}
        ${formattedGallery}
        ${formattedVideos}
    </main>

</body>
</html>`;
        }

        function downloadHTML() {
            const fileName = (document.getElementById('fileName').value || 'page').trim() + '.html';
            const blob = new Blob([generateHTML()], { type: 'text/html;charset=utf-8;' });
            const link = document.createElement('a');
            link.href = URL.createObjectURL(blob);
            link.download = fileName;
            link.click();
        }

        function copyHTML() {
            navigator.clipboard.writeText(generateHTML()).then(() => {
                alert('Код страницы скопирован!');
            });
        }

        updatePreview();
    </script>
</body>
</html>
