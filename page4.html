<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Тема с фото и видео</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <main class="container">
        <header class="site-header">
            <img src="images/logo.png" alt="Логотип" class="header-logo">
            <span class="header-title">Музей СВО</span>
        </header>

        <h1>Тема с фото и видео</h1>
        <p>Первый абзац.</p>
        <p>Ниже расположены фото с прокруткой и видеофайл.</p>
        <div class="gallery-container">
            <div class="gallery-item">
                <img src="images/page2.png" alt="Фото">
            </div>
            <div class="gallery-item">
                <img src="images/page1.png" alt="Фото">
            </div>
        </div>
        
        <div class="video-wrapper">
            <video controls preload="metadata">
                <source src="videos/video.mp4" type="video/mp4">
                Ваш браузер не поддерживает видео.
            </video>
        </div>
    </main>

</body>
</html>
